<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- 1. Пропала кодировка: без неё возможны кракозябры -->
  <meta charset="utf-8">
  <title>Сломанный чат</title>
</head>
<body>
  <h1>Сломанный чат</h1>
  <!-- 2. Не был закрыт </b>: весь текст дальше становился жирным -->
  <p>Вы вошли как <b>Вова</b></p>

  <div class="message">
    <b class="author">Аня</b>
    <!-- 3. Не была закрыта кавычка в class="text" -->
    <span class="text">Кто-нибудь видит это сообщение?</span>
  <!-- 4. Не был закрыт </div>: второе сообщение оказывалось внутри первого -->
  </div>

  <div class="message">
    <b class="author">Боря</b>
    <span class="text">Вижу!</span>
  </div>

  <!-- 5. Пункты списка <li> должны лежать внутри списка <ul> -->
  <ul>
    <li>Аня</li>
    <li>Боря</li>
  </ul>

  <!-- 6. У <input> нет закрывающего тега -->
  <input type="text" placeholder="Сообщение…">
</body>
</html>
